name: Build Apple artifacts
# This action runs on Apple packaging and bridge updates.
on:
  push:
    paths:
      - "iOS/**"
      - "xplat/**"
      - "flopper-core/**"
      - "flopper-native/**"
      - "flopper-ios/**"
      - "Package.swift"
      - "scripts/generate-spm-manifest.sh"
  pull_request:
    paths:
      - "iOS/**"
      - "xplat/**"
      - "flopper-core/**"
      - "flopper-native/**"
      - "flopper-ios/**"
      - "Package.swift"
      - "scripts/generate-spm-manifest.sh"

jobs:
  assemble-xcframework:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3.5.3
      - uses: actions/setup-java@v3.14.1
        with:
          distribution: temurin
          java-version: 17
      - name: Assemble Flopper Apple XCFramework
        run: ./gradlew :flopper-ios:assembleFlopperKitKmpXCFramework
      - name: Validate local Swift Package manifest
        run: swift package describe
      - name: Verify podless Apple smoke build
        run: ./scripts/verify-apple-xcframework.sh
