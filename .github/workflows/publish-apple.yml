name: Publish Apple artifacts
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to upload artifacts to"
        required: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3.5.3
      - uses: actions/setup-java@v3.14.1
        with:
          distribution: temurin
          java-version: 17
      - name: Assemble Flopper Apple XCFramework
        run: ./gradlew :flopper-ios:assembleFlopperKitKmpXCFramework
      - name: Archive XCFramework
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            flopper-ios/build/XCFrameworks/release/FlopperKitKmp.xcframework \
            dist/FlopperKitKmp.xcframework.zip
      - name: Generate Swift Package manifest for release
        run: |
          CHECKSUM=$(swift package compute-checksum dist/FlopperKitKmp.xcframework.zip)
          TAG_NAME="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          ARTIFACT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/FlopperKitKmp.xcframework.zip"
          ./scripts/generate-spm-manifest.sh "$TAG_NAME" "$ARTIFACT_URL" "$CHECKSUM" > dist/Package.swift
      - name: Attach XCFramework to release
        if: ${{ github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
        uses: aigoncharov/github-upload-release-artifacts-action@2.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          created_tag: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          args: 'dist/FlopperKitKmp.xcframework.zip,dist/Package.swift'
